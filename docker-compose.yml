services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: ecommerce-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  auth-postgres:
    image: postgres:16-alpine
    container_name: ecommerce-auth-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  orders-postgres:
    image: postgres:16-alpine
    container_name: ecommerce-orders-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    volumes:
      - orders-postgres-data:/var/lib/postgresql/data

  inventory-postgres:
    image: postgres:16-alpine
    container_name: ecommerce-inventory-postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    volumes:
      - inventory-postgres-data:/var/lib/postgresql/data

  shipping-mongodb:
    image: mongo:7
    container_name: ecommerce-shipping-mongodb
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: shipping
    volumes:
      - shipping-mongodb-data:/data/db

  notification-cassandra:
    image: cassandra:5
    container_name: ecommerce-notification-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: ecommerce-notification
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
    volumes:
      - notification-cassandra-data:/var/lib/cassandra

  customer-postgres:
    image: postgres:16-alpine
    container_name: ecommerce-customer-postgres
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: customer
      POSTGRES_USER: customer
      POSTGRES_PASSWORD: customer
    volumes:
      - customer-postgres-data:/var/lib/postgresql/data

  seller-postgres:
    image: postgres:16-alpine
    container_name: ecommerce-seller-postgres
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: seller
      POSTGRES_USER: seller
      POSTGRES_PASSWORD: seller
    volumes:
