    restart: on-failure
    environment:
      SERVICE_NAME: auth-service
      HTTP_PORT: 3000
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: auth-service
      KAFKA_CONSUMER_GROUP_ID: auth-service-demo-group
      DEMO_TOPIC: auth.demo.event.v1
      DATABASE_URL: postgresql://auth:auth@auth-postgres:5432/auth
      JWT_ACCESS_SECRET: dev-auth-access-secret
      JWT_REFRESH_SECRET: dev-auth-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN_DAYS: 7
