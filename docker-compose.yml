services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: ecommerce-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  auth-postgres:
    image: postgres:16-alpine
    container_name: ecommerce-auth-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data

  orders-postgres:
    image: postgres:16-alpine
    container_name: ecommerce-orders-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    volumes:
      - orders-postgres-data:/var/lib/postgresql/data

  inventory-postgres:
    image: postgres:16-alpine
    container_name: ecommerce-inventory-postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    volumes:
      - inventory-postgres-data:/var/lib/postgresql/data

  shipping-mongodb:
    image: mongo:7
    container_name: ecommerce-shipping-mongodb
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: shipping
    volumes:
      - shipping-mongodb-data:/data/db

  notification-cassandra:
    image: cassandra:5
    container_name: ecommerce-notification-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: ecommerce-notification
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
    volumes:
      - notification-cassandra-data:/var/lib/cassandra

  auth-service:
    build:
      context: ./auth-service
    container_name: ecommerce-auth-service
    ports:
      - "3001:3000"
    restart: on-failure
    environment:
      SERVICE_NAME: auth-service
      HTTP_PORT: 3000
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: auth-service
      KAFKA_CONSUMER_GROUP_ID: auth-service-demo-group
      DEMO_TOPIC: auth.demo.event.v1
      DATABASE_URL: postgresql://auth:auth@auth-postgres:5432/auth
    depends_on:
      kafka:
        condition: service_healthy
      auth-postgres:
        condition: service_started

  orders-service:
    build:
      context: ./orders-service
    container_name: ecommerce-orders-service
    ports:
      - "3002:3000"
    restart: on-failure
    environment:
      SERVICE_NAME: orders-service
      HTTP_PORT: 3000
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: orders-service
      KAFKA_CONSUMER_GROUP_ID: orders-service-demo-group
      DEMO_TOPIC: orders.demo.event.v1
      DATABASE_URL: postgresql://orders:orders@orders-postgres:5432/orders
    depends_on:
      kafka:
        condition: service_healthy
      orders-postgres:
        condition: service_started

  inventory-service:
    build:
      context: ./inventory-service
    container_name: ecommerce-inventory-service
    ports:
      - "3003:3000"
    restart: on-failure
    environment:
      SERVICE_NAME: inventory-service
      HTTP_PORT: 3000
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: inventory-service
      KAFKA_CONSUMER_GROUP_ID: inventory-service-demo-group
      DEMO_TOPIC: inventory.demo.event.v1
      DATABASE_URL: postgresql://inventory:inventory@inventory-postgres:5432/inventory
    depends_on:
      kafka:
        condition: service_healthy
      inventory-postgres:
        condition: service_started

  shipping-service:
    build:
      context: ./shipping-service
    container_name: ecommerce-shipping-service
    ports:
      - "3004:3000"
    restart: on-failure
    environment:
      SERVICE_NAME: shipping-service
      HTTP_PORT: 3000
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: shipping-service
      KAFKA_CONSUMER_GROUP_ID: shipping-service-demo-group
      DEMO_TOPIC: shipping.demo.event.v1
      MONGODB_URI: mongodb://shipping-mongodb:27017/shipping
    depends_on:
      kafka:
        condition: service_healthy
      shipping-mongodb:
        condition: service_started

  notification-service:
    build:
      context: ./notification-service
    container_name: ecommerce-notification-service
    ports:
      - "3005:3000"
    restart: on-failure
    environment:
      SERVICE_NAME: notification-service
      HTTP_PORT: 3000
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: notification-service
      KAFKA_CONSUMER_GROUP_ID: notification-service-demo-group
      DEMO_TOPIC: notification.demo.event.v1
      CASSANDRA_CONTACT_POINTS: notification-cassandra:9042
    depends_on:
      kafka:
        condition: service_healthy
      notification-cassandra:
        condition: service_started

volumes:
  auth-postgres-data:
  orders-postgres-data:
  inventory-postgres-data:
  shipping-mongodb-data:
  notification-cassandra-data:
