    container_name: ecommerce-catalog-postgres
    ports:
      - "5438:5432"
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    volumes:
      - catalog-postgres-data:/var/lib/postgresql/data

  search-opensearch:
    image: opensearchproject/opensearch:2.19.3
    container_name: ecommerce-search-opensearch
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - search-opensearch-data:/usr/share/opensearch/data

  recommendation-cassandra:
